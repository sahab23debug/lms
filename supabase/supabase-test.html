<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <p>This page tests your Supabase connection for the DSA Tracker.</p>

    <div>
        <label>Supabase URL:</label><br>
        <input type="text" id="supabase-url" placeholder="https://msjgwgffrxyzmducmemt.supabase.co" style="width: 100%; padding: 8px; margin: 5px 0;">
    </div>

    <div>
        <label>Supabase Anon Key:</label><br>
        <input type="text" id="supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zamd3Z2Zmcnh5em1kdWNtZW10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MDYzMTMsImV4cCI6MjA5MjE4MjMxM30.OwMszZVSjg5ZjZeOxwArcyqC-8__vBCyAIWTuzRUjhs" style="width: 100%; padding: 8px; margin: 5px 0;">
    </div>

    <button onclick="testConnection()">Test Connection</button>
    <button onclick="testTables()">Test Tables</button>
    <button onclick="testData()">Test Data Operations</button>

    <div id="results"></div>

    <script>
        let supabase = null;

        function testConnection() {
            const url = document.getElementById('supabase-url').value;
            const key = document.getElementById('supabase-key').value;

            if (!url || !key) {
                showResult('Please enter both URL and key', 'error');
                return;
            }

            try {
                supabase = supabase.createClient(url, key);
                showResult('Supabase client created successfully!', 'success');
            } catch (error) {
                showResult('Failed to create Supabase client: ' + error.message, 'error');
            }
        }

        async function testTables() {
            if (!supabase) {
                showResult('Please test connection first', 'error');
                return;
            }

            try {
                // Test users table
                const { data: users, error: usersError } = await supabase
                    .from('users')
                    .select('*')
                    .limit(1);

                if (usersError) throw usersError;

                // Test students table
                const { data: students, error: studentsError } = await supabase
                    .from('students')
                    .select('*')
                    .limit(1);

                if (studentsError) throw studentsError;

                // Test topics table
                const { data: topics, error: topicsError } = await supabase
                    .from('topics')
                    .select('*')
                    .limit(1);

                if (topicsError) throw topicsError;

                // Test activities table
                const { data: activities, error: activitiesError } = await supabase
                    .from('activities')
                    .select('*')
                    .limit(1);

                if (activitiesError) throw activitiesError;

                showResult('All tables accessible! Database is properly set up.', 'success');

            } catch (error) {
                showResult('Table access failed: ' + error.message + '. Make sure you ran the SQL schema.', 'error');
            }
        }

        async function testData() {
            if (!supabase) {
                showResult('Please test connection first', 'error');
                return;
            }

            try {
                // Test inserting a test user
                const testUser = {
                    username: 'test_' + Date.now(),
                    password: 'test123',
                    role: 'student',
                    studentId: 999
                };

                const { data: userData, error: userError } = await supabase
                    .from('users')
                    .insert(testUser)
                    .select();

                if (userError) throw userError;

                // Test inserting a test student
                const testStudent = {
                    id: 999,
                    name: 'Test Student',
                    avatar: 'TS',
                    color: 0,
                    topicsDone: 0,
                    score: 0,
                    streak: 0,
                    status: 'offline',
                    topics: [],
                    loginHistory: []
                };

                const { data: studentData, error: studentError } = await supabase
                    .from('students')
                    .insert(testStudent)
                    .select();

                if (studentError) throw studentError;

                // Clean up test data
                await supabase.from('users').delete().eq('username', testUser.username);
                await supabase.from('students').delete().eq('id', 999);

                showResult('Data operations working! Insert, select, and delete all successful.', 'success');

            } catch (error) {
                showResult('Data operations failed: ' + error.message, 'error');
            }
        }

        function showResult(message, type) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'test-result ' + type;
            div.textContent = message;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }
    </script>
</body>
</html>
